<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" href="assets/logo.png">

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#f5f7f6;color:#17221b}button,input,select,textarea{font:inherit}.hide{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#14532d,#166534,#0f766e)}.loginbox{width:min(420px,100%);background:white;padding:30px;border-radius:22px;box-shadow:0 25px 70px #0004;text-align:center}.loginbox img{width:80px;height:80px;object-fit:contain}.loginbox h1{margin:8px 0 4px}.loginbox p{color:#6b7280;margin:0 0 20px}
label{display:block;text-align:left;font-weight:700;font-size:13px;margin:12px 0 6px}.input{width:100%;padding:11px;border:1px solid #dfe5e1;border-radius:10px;background:#fff;outline:0}.input:focus{border-color:#15803d;box-shadow:0 0 0 3px #15803d18}
.btn{border:0;border-radius:9px;padding:10px 14px;background:#eef2f0;color:#173025;font-weight:700;cursor:pointer}.primary{background:#166534;color:#fff}.danger{background:#fee2e2;color:#991b1b}.loginbtn{width:100%;margin-top:18px}.msg{margin-top:12px;padding:10px;border-radius:9px;background:#fef2f2;color:#991b1b;font-size:13px}
.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#0e2417;color:#dceee2;padding:16px 12px;z-index:20;overflow:auto}.brand{display:flex;align-items:center;gap:9px;padding:5px 8px 20px}.brand img{width:44px;height:44px;object-fit:contain;border-radius:50%;background:#fff}.brand small{display:block;color:#9db4a5;margin-top:2px}.nav button{display:block;width:100%;padding:10px 12px;margin:3px 0;border:0;border-radius:9px;background:transparent;color:#cfe0d4;text-align:left;font-weight:650;cursor:pointer}.nav button:hover,.nav button.active{background:#1b4d2d;color:#fff}.nav .logout{color:#fecaca;margin-top:12px}
.main{margin-left:250px}.top{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.menu{display:none;border:0;border-radius:8px;padding:8px 10px}.content{padding:22px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.head h2{margin:0}.muted{color:#6b7280;font-size:13px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px;box-shadow:0 7px 25px #0f172a0b}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:17px;background:#fff;border:1px solid #e5e7eb;border-radius:15px}.stat b{display:block;color:#6b7280;font-size:12px}.stat strong{display:block;font-size:26px;margin-top:5px}.two{grid-template-columns:1.2fr .8fr}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:13px}.toolbar .input{max-width:280px}
.table{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:10px 11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f8faf9;color:#52635a;font-size:12px}tr:last-child td{border:0}.empty{text-align:center;color:#6b7280;padding:28px}.badge{display:inline-block;border-radius:99px;padding:3px 8px;background:#ecfdf5;color:#166534;font-size:11px;font-weight:800}.bad{background:#fef2f2;color:#991b1b}.warn{background:#fff7ed;color:#9a3412}
.modalbg{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:15px;z-index:100}.modalbg.show{display:grid}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px}.mh,.mf{padding:15px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}.mf{border-top:1px solid #e5e7eb;border-bottom:0;justify-content:flex-end;gap:8px}.mb{padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.close{border:0;border-radius:8px;width:34px;height:34px;font-size:20px}.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:12px 15px;border-radius:10px;z-index:200;display:none}.toast.show{display:block}.ok{background:#166534}.err{background:#991b1b}
@media(max-width:950px){.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:720px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin-left:0}.menu{display:block}.top{padding:0 13px}.content{padding:14px}.form{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="loginbox">
  <img src="assets/logo.png" alt="Dishari Academy" onerror="this.style.display='none'">
  <h1>দিশারী একাডেমী</h1><p>School Management System</p>
  <form id="loginForm"><label>Email</label><input id="email" class="input" type="email" required autocomplete="username">
  <label>Password</label><input id="password" class="input" type="password" required autocomplete="current-password">

 </div>
</div>
<div id="app" class="app hide">
<aside id="side" class="side"><div class="brand"><img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'"><div><b>দিশারী একাডেমী</b><small>Management System</small></div></div><nav id="nav" class="nav"></nav></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button id="menu" class="menu">☰</button><b id="title">Dashboard</b></div><span id="user"></span></header><section id="content" class="content"></section></main>
</div>
<div id="modalbg" class="modalbg"><div class="modal"><div class="mh"><b id="mtitle">Add</b><button id="x" class="close">×</button></div><form id="form"><div id="mb" class="mb"></div><div class="mf"><button type="button" id="cancel" class="btn">Cancel</button><button class="btn primary">Save</button></div></form></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://huegvliiwivgdbkfgxq.supabase.co";
const SUPABASE_KEY="sb_publishable_MsF91SLIwNDJdpDKfGhEmQ_VnSW2OJb";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const CFG={
students:{title:"Students",icon:"🎓",cols:["admission_no","name","class_name","section","gender","dob","guardian_name","phone","address","admission_date","status"],lab:{admission_no:"Admission No.",name:"Student Name",class_name:"Class",section:"Section",gender:"Gender",dob:"DOB",guardian_name:"Guardian",phone:"Phone",address:"Address",admission_date:"Admission Date",status:"Status"},types:{dob:"date",admission_date:"date"},sel:{gender:["Male","Female","Other"],status:["Active","Inactive"]},search:["name","admission_no","guardian_name","phone"]},
teachers:{title:"Teachers",icon:"👨‍🏫",cols:["employee_id","name","subject","phone","email","joining_date","salary","status"],lab:{employee_id:"Employee ID",name:"Teacher Name",subject:"Subject",phone:"Phone",email:"Email",joining_date:"Joining Date",salary:"Salary",status:"Status"},types:{joining_date:"date",salary:"number"},sel:{status:["Active","Inactive"]},search:["name","employee_id","subject","phone","email"]},
attendance:{title:"Attendance",icon:"📋",cols:["student_id","attendance_date","status","remarks"],lab:{student_id:"Student",attendance_date:"Date",status:"Status",remarks:"Remarks"},types:{attendance_date:"date"},sel:{status:["Present","Absent","Late"]},fk:{student_id:"students"},search:["attendance_date","status","remarks"]},
fees:{title:"Fees",icon:"💳",cols:["student_id","fee_month","amount","paid_amount","payment_date","payment_method","status","receipt_no"],lab:{student_id:"Student",fee_month:"Month",amount:"Amount",paid_amount:"Paid Amount",payment_date:"Payment Date",payment_method:"Payment Method",status:"Status",receipt_no:"Receipt No."},types:{fee_month:"month",amount:"number",paid_amount:"number",payment_date:"date"},sel:{payment_method:["Cash","UPI","Bank Transfer","Cheque","Other"],status:["Paid","Partial","Pending"]},fk:{student_id:"students"},search:["fee_month","receipt_no","status"]},
exams:{title:"Exams",icon:"📝",cols:["exam_name","class_name","exam_date","description"],lab:{exam_name:"Exam Name",class_name:"Class",exam_date:"Exam Date",description:"Description"},types:{exam_date:"date"},search:["exam_name","class_name","description"]},
results:{title:"Results",icon:"🏆",cols:["student_id","exam_id","subject","marks","total_marks","grade","remarks"],lab:{student_id:"Student",exam_id:"Exam",subject:"Subject",marks:"Marks",total_marks:"Total Marks",grade:"Grade",remarks:"Remarks"},types:{marks:"number",total_marks:"number"},fk:{student_id:"students",exam_id:"exams"},search:["subject","grade","remarks"]},
admissions:{title:"Admissions",icon:"📥",cols:["applicant_name","class_name","guardian_name","phone","address","application_date","status"],lab:{applicant_name:"Applicant Name",class_name:"Class",guardian_name:"Guardian",phone:"Phone",address:"Address",application_date:"Application Date",status:"Status"},types:{application_date:"date"},sel:{status:["Pending","Approved","Rejected"]},search:["applicant_name","class_name","guardian_name","phone","status"]},
notices:{title:"Notices",icon:"📢",cols:["title","content","publish_date","status"],lab:{title:"Title",content:"Content",publish_date:"Publish Date",status:"Status"},types:{publish_date:"date"},sel:{status:["Published","Draft"]},search:["title","content","status"]},
gallery:{title:"Gallery",icon:"🖼️",cols:["title","image_url","description"],lab:{title:"Title",image_url:"Image URL",description:"Description"},search:["title","description","image_url"]},
salary_payments:{title:"Teacher Salary",icon:"💰",cols:["teacher_id","payment_month","amount","payment_date","payment_method","status"],lab:{teacher_id:"Teacher",payment_month:"Month",amount:"Amount",payment_date:"Payment Date",payment_method:"Payment Method",status:"Status"},types:{payment_month:"month",amount:"number",payment_date:"date"},sel:{payment_method:["Cash","UPI","Bank Transfer","Cheque","Other"],status:["Paid","Pending"]},fk:{teacher_id:"teachers"},search:["payment_month","status","payment_method"]}
};
let page="dashboard",rows=[],editId=null,tableName=null,user=null,profile=null,fkCache={};
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
function notify(s,type=""){let t=$("toast");t.textContent=s;t.className="toast show "+(type==="error"?"err":type==="success"?"ok":"");clearTimeout(window.tt);window.tt=setTimeout(()=>t.className="toast",3000)}
function badge(v){let c=/absent|rejected|inactive|pending/i.test(v)?"bad":/partial|late|draft/i.test(v)?"warn":"";return `<span class="badge ${c}">${esc(v)}</span>`}
async function get(table){let r=await supabaseClient.from(table).select("*").order("created_at",{ascending:false}).limit(1000);if(r.error&&/created_at/i.test(r.error.message))r=await supabaseClient.from(table).select("*").limit(1000);if(r.error)throw r.error;return r.data||[]}
async function count(table){let r=await supabaseClient.from(table).select("*",{count:"exact",head:true});if(r.error)throw r.error;return r.count||0}
async function fkOptions(table){if(fkCache[table])return fkCache[table];let out={};for(const [field,ft] of Object.entries(CFG[table].fk||{})){let a=await get(ft).catch(()=>[]);out[field]=a.map(x=>({id:x.id,label:ft==="students"?`${x.name||""} (${x.admission_no||x.id})`:ft==="teachers"?`${x.name||""} (${x.employee_id||x.id})`:x.exam_name||x.name||x.id}))}fkCache[table]=out;return out}
function nav(){let a=[["dashboard","📊","Dashboard"],...Object.entries(CFG).map(([k,c])=>[k,c.icon,c.title]),["reports","📈","Reports"],["settings","⚙️","Settings"]];$("nav").innerHTML=a.map(x=>`<button data-p="${x[0]}" class="${page===x[0]?"active":""}">${x[1]} ${x[2]}</button>`).join("")+`<button class="logout" id="logout">🚪 Logout</button>`;document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>go(b.dataset.p));$("logout").onclick=logout}
function go(p){page=p;$("side").classList.remove("open");nav();$("title").textContent=p==="dashboard"?"Dashboard":p==="reports"?"Reports":p==="settings"?"Settings":CFG[p].title;if(p==="dashboard")dashboard();else if(p==="reports")reports();else if(p==="settings")settings();else tablePage(p)}
async function dashboard(){
$("content").innerHTML=`<div class="head"><div><h2>Dashboard</h2><span class="muted">দিশারী একাডেমী — Live Database</span></div><button class="btn" onclick="dashboard()">↻ Refresh</button></div><div id="stats" class="grid stats">Loading...</div><div class="grid two" style="margin-top:15px"><div class="card"><h3>Recent Admissions</h3><div id="ra">Loading...</div></div><div class="card"><h3>Published Notices</h3><div id="rn">Loading...</div></div></div>`;
try{let [s,t,a,n,f,at,e]=await Promise.all([count("students"),count("teachers"),count("admissions"),count("notices"),get("fees").catch(()=>[]),get("attendance").catch(()=>[]),count("exams")]);let paid=f.reduce((x,r)=>x+Number(r.paid_amount||0),0),due=f.reduce((x,r)=>x+Math.max(0,Number(r.amount||0)-Number(r.paid_amount||0)),0),ta=at.filter(x=>x.attendance_date===today()),pr=ta.filter(x=>x.status==="Present").length;$("stats").innerHTML=[["Students",s,""],["Teachers",t,""],["Today Present",pr,`${ta.length?Math.round(pr/ta.length*100):0}%`],["Fees Collected","₹"+paid.toLocaleString("en-IN"),"Due ₹"+due.toLocaleString("en-IN")],["Admissions",a,""],["Exams",e,""],["Notices",n,""],["Established",2020,""]].map(x=>`<div class="stat"><b>${x[0]}</b><strong>${x[1]}</strong><span class="muted">${x[2]}</span></div>`).join("");let ar=await get("admissions").catch(()=>[]),nr=await get("notices").catch(()=>[]);$("ra").innerHTML=ar.slice(0,5).map(x=>`<div style="padding:9px 0;border-bottom:1px solid #eee"><b>${esc(x.applicant_name)}</b><br><span class="muted">${esc(x.class_name||"")} · ${esc(x.status||"")}</span></div>`).join("")||`<div class="empty">কোনো data নেই।</div>`;$("rn").innerHTML=nr.filter(x=>x.status==="Published").slice(0,5).map(x=>`<div style="padding:9px 0;border-bottom:1px solid #eee"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.publish_date||"")}</span></div>`).join("")||`<div class="empty">কোনো notice নেই।</div>`}catch(e){notify(e.message,"error")}}
async function tablePage(t){let c=CFG[t];$("content").innerHTML=`<div class="head"><div><h2>${c.icon} ${c.title}</h2><span class="muted">Supabase থেকে real records</span></div><div class="actions"><button class="btn" id="ref">↻ Refresh</button><button class="btn primary" id="add">＋ Add</button></div></div><div class="card"><div class="toolbar"><input id="search" class="input" placeholder="Search..."><button class="btn" id="csv">⬇ CSV</button></div><div id="area">Loading...</div></div>`;$("ref").onclick=()=>load(t);$("add").onclick=()=>open(t);$("csv").onclick=()=>exportCSV(t);$("search").oninput=()=>draw(t);await load(t)}
async function load(t){tableName=t;try{rows=await get(t);await draw(t)}catch(e){$("area").innerHTML=`<div class="msg">${esc(e.message)}</div>`}}
async function draw(t){let c=CFG[t],q=$("search")?.value.toLowerCase()||"",a=rows.filter(r=>!q||c.search.some(k=>String(r[k]??"").toLowerCase().includes(q)));if(c.fk&&!fkCache[t])await fkOptions(t);let h=c.cols.map(k=>`<th>${esc(c.lab[k]||k)}</th>`).join("")+"<th>Actions</th>";let b=a.length?a.map(r=>`<tr>${c.cols.map(k=>{let v=r[k]??"";if(c.fk?.[k])v=(fkCache[t]?.[k]||[]).find(o=>String(o.id)===String(v))?.label||v;return `<td>${k==="status"?badge(v):esc(v)}</td>`}).join("")}<td><div class="actions"><button class="btn" onclick="open('${t}','${esc(r.id)}')">Edit</button><button class="btn danger" onclick="del('${t}','${esc(r.id)}')">Delete</button></div></td></tr>`).join(""):`<tr><td colspan="${c.cols.length+1}" class="empty">কোনো তথ্য পাওয়া যায়নি।</td></tr>`;$("area").innerHTML=`<div class="table"><table><thead><tr>${h}</tr></thead><tbody>${b}</tbody></table></div><p class="muted">${a.length} record(s)</p>`}
async function open(t,id=null){tableName=t;editId=id;let c=CFG[t],r=id?rows.find(x=>String(x.id)===String(id))||{}:{};let f=c.fk?await fkOptions(t):{};$("mtitle").textContent=(id?"Edit ":"Add ")+c.title;$("mb").innerHTML=`<div class="form">${c.cols.map(k=>{let l=c.lab[k]||k,v=r[k]??"",ty=c.types?.[k]||"text";if(c.fk?.[k])return `<label>${l}<select class="input" name="${k}"><option value="">Select...</option>${(f[k]||[]).map(o=>`<option value="${esc(o.id)}" ${String(o.id)===String(v)?"selected":""}>${esc(o.label)}</option>`).join("")}</select></label>`;if(c.sel?.[k])return `<label>${l}<select class="input" name="${k}"><option value="">Select...</option>${c.sel[k].map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select></label>`;if(["content","description","address","remarks"].includes(k))return `<label class="full">${l}<textarea class="input" name="${k}" rows="4">${esc(v)}</textarea></label>`;return `<label>${l}<input class="input" name="${k}" type="${ty}" value="${esc(v)}"></label>`}).join("")}</div>`;$("modalbg").classList.add("show")}
$("form").onsubmit=async e=>{e.preventDefault();let data={};new FormData(e.target).forEach((v,k)=>data[k]=v===""?null:v);try{let r=editId?await supabaseClient.from(tableName).update(data).eq("id",editId):await supabaseClient.from(tableName).insert(data);if(r.error)throw r.error;$("modalbg").classList.remove("show");notify("তথ্য সফলভাবে সংরক্ষণ হয়েছে।","success");fkCache[tableName]=null;await load(tableName)}catch(x){notify(x.message,"error")}};
async function del(t,id){if(!confirm("আপনি কি সত্যিই এই তথ্যটি মুছে ফেলতে চান?"))return;let r=await supabaseClient.from(t).delete().eq("id",id);if(r.error)notify(r.error.message,"error");else{notify("মুছে ফেলা হয়েছে।","success");load(t)}}
function exportCSV(t){if(!rows.length)return notify("Export করার মতো data নেই।");let c=CFG[t],lines=[c.cols.map(k=>`"${c.lab[k]||k}"`).join(","),...rows.map(r=>c.cols.map(k=>`"${String(r[k]??"").replace(/"/g,'""')}"`).join(","))];let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"}));a.download=`dishari-${t}-${today()}.csv`;a.click()}
async function reports(){let e=Object.entries(CFG);$("content").innerHTML=`<div class="head"><div><h2>📈 Reports</h2><span class="muted">CSV reports from Supabase</span></div></div><div id="rc" class="grid stats"></div><div class="card" style="margin-top:15px"><h3>Export</h3><div id="rb" class="actions"></div></div>`;$("rb").innerHTML=e.map(([k,c])=>`<button class="btn" onclick="report('${k}')">${c.icon} ${c.title}</button>`).join("");$("rc").innerHTML=(await Promise.all(e.map(async([k,c])=>[c.title,await count(k).catch(()=>0)]))).map(x=>`<div class="stat"><b>${x[0]}</b><strong>${x[1]}</strong><span class="muted">records</span></div>`).join("")}
async function report(t){rows=await get(t);exportCSV(t)}
function settings(){$("content").innerHTML=`<div class="head"><div><h2>⚙️ Settings</h2><span class="muted">Account and school information</span></div></div><div class="grid two"><div class="card"><h3>School Information</h3><p><b>School:</b> দিশারী একাডেমী</p><p><b>English:</b> Dishari Academy</p><p><b>Location:</b> Gurail Hatkhola, Tapan, Dakshin Dinajpur, West Bengal</p><p><b>Established:</b> 2020</p><p><b>Admission:</b> Nursery to Class IX</p><p><b>Contact:</b> 9609707645 / 8167038811</p></div><div class="card"><h3>Account</h3><p><b>Email:</b> ${esc(user?.email)}</p><p><b>Name:</b> ${esc(profile?.full_name||"—")}</p><p><b>Role:</b> ${esc(profile?.role||"—")}</p><button class="btn danger" onclick="logout()">Logout</button></div></div>`}
async function access(){let s=(await supabaseClient.auth.getSession()).data.session;if(!s)return showLogin();user=s.user;let r=await supabaseClient.from("profiles").select("user_id,full_name,role").eq("user_id",user.id).maybeSingle();if(r.error||!r.data||!["admin","staff"].includes(r.data.role)){await supabaseClient.auth.signOut();return showLogin("আপনার access নেই।")}profile=r.data;showApp()}
function showLogin(m=""){$("login").classList.remove("hide");$("app").classList.add("hide");$("loginMsg").innerHTML=m?`<div class="msg">${esc(m)}</div>`:""}
function showApp(){$("login").classList.add("hide");$("app").classList.remove("hide");$("user").textContent=`${profile.full_name||user.email} · ${profile.role}`;nav();go("dashboard")}
async function logout(){await supabaseClient.auth.signOut();showLogin();notify("Logged out","success")}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginBtn").disabled=true;try{let r=await supabaseClient.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)throw r.error;await access()}catch(x){$("loginMsg").innerHTML=`<div class="msg">${esc(x.message)}</div>`}finally{$("loginBtn").disabled=false;$("loginBtn").textContent="Login"}};
$("x").onclick=$("cancel").onclick=()=>$("modalbg").classList.remove("show");$("modalbg").onclick=e=>{if(e.target.id==="modalbg")$("modalbg").classList.remove("show")};$("menu").onclick=()=>$("side").classList.toggle("open");
supabaseClient.auth.onAuthStateChange(()=>{});
